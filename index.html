<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFMC Query Studio Lite</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --accent-color: #007acc;
            --text-color: #d4d4d4;
            --border-color: #3c3c3c;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 15px; }

        /* Toolbar */
        .toolbar { display: flex; gap: 10px; background: #252526; padding: 10px; border-radius: 5px; border: 1px solid var(--border-color); align-items: center; }
        input[type="text"], select { background: #3c3c3c; border: 1px solid #555; color: white; padding: 8px; border-radius: 3px; }
        input[type="text"] { flex-grow: 1; }
        .run-btn { background-color: var(--accent-color); color: white; border: none; padding: 8px 20px; cursor: pointer; border-radius: 3px; font-weight: bold; }
        .run-btn:hover { background-color: #005f9e; }

        /* Editor */
        textarea { width: 100%; height: 250px; background-color: #1e1e1e; color: #9cdcfe; border: 1px solid var(--accent-color); padding: 15px; font-family: 'Consolas', monospace; font-size: 14px; box-sizing: border-box; border-radius: 5px; }

        /* The Output Table (Query Studio Style) */
        #outputArea { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; font-family: sans-serif; }
        th, td { border: 1px solid #444; padding: 8px; text-align: left; }
        th { background-color: #333; color: white; }
        tr:nth-child(even) { background-color: #252526; }
        tr:hover { background-color: #303030; }
        .raw-text { white-space: pre-wrap; font-family: monospace; padding: 15px; background: #111; border-left: 4px solid var(--accent-color); }
    </style>
</head>
<body>

<div class="container">
    <div class="toolbar">
        <h3>⚡ Query Studio Lite</h3>
        <select id="langSelect" onchange="changeTemplate()">
            <option value="" disabled selected>Load Template...</option>
            <option value="data">SELECT (Instant Data)</option>
            <option value="sql">SELECT (Standard SQL - Slow)</option>
            <option value="ampscript">AMPscript</option>
        </select>
        <input type="text" id="sfmcUrl" placeholder="Paste Cloud Page URL here...">
        <button class="run-btn" onclick="runCode()">Run</button>
    </div>

    <textarea id="codeEditor" spellcheck="false" placeholder="Select 'SELECT (Instant Data)' to start querying..."></textarea>
    
    <div id="outputArea"></div>
</div>

<script>
    // --- 1. Templates ---
    const templates = {
        // This is the "Magic" script that acts like Query Studio
        data: `<script runat="server">\n    Platform.Load("Core", "1");\n    var proxy = new Script.Util.WSProxy();\n    try {\n        \n        /* 1. MODIFY THIS SETTINGS */\n        var deName = "ENT.Subscribers"; // Name of Data Extension or View\n        var cols = ["SubscriberKey", "EmailAddress", "Status"]; // Columns to Select\n        var filter = {\n            Property: "Status",\n            SimpleOperator: "equals",\n            Value: "Active"\n        };\n\n        /* 2. EXECUTE QUERY */\n        var data = proxy.retrieve(deName, cols, filter);\n        \n        /* 3. RETURN JSON (Auto-Table) */\n        Write(Stringify(data.Results));\n\n    } catch(e) {\n        Write(Stringify(e));\n    }\n<\/script>`,

        // Explanation of why raw SQL is hard
        sql: `\n`,

        ampscript: `%%[\n    SET @msg = "Hello World"\n]%%\nOutput: %%=v(@msg)=%%`
    };

    // --- 2. Load URL from Memory ---
    window.onload = () => {
        const savedUrl = localStorage.getItem("sfmc_runner_url");
        if(savedUrl) document.getElementById('sfmcUrl').value = savedUrl;
    };

    function changeTemplate() {
        const lang = document.getElementById('langSelect').value;
        if(templates[lang]) document.getElementById('codeEditor').value = templates[lang];
    }

    // --- 3. Run & Format Results ---
    async function runCode() {
        const url = document.getElementById('sfmcUrl').value;
        const code = document.getElementById('codeEditor').value;
        const out = document.getElementById('outputArea');

        if(!url) { alert("Need URL!"); return; }
        localStorage.setItem("sfmc_runner_url", url);
        
        out.innerHTML = "<p style='color:#888'>Running Query...</p>";

        try {
            const res = await fetch(url, { method: 'POST', body: code });
            const text = await res.text();

            // Try to parse JSON to make a Table
            try {
                const jsonData = JSON.parse(text);
                if(Array.isArray(jsonData) && jsonData.length > 0) {
                    out.innerHTML = createTable(jsonData);
                } else {
                    out.innerHTML = `<div class="raw-text">${text}</div>`;
                }
            } catch (e) {
                // Not JSON? Just show text
                out.innerHTML = `<div class="raw-text">${text}</div>`;
            }
            
        } catch (err) {
            out.innerHTML = "Error: " + err;
        }
    }

    // --- 4. The Table Generator ---
    function createTable(data) {
        if(data.length === 0) return "No Rows Found.";
        
        // Get headers from first object
        const headers = Object.keys(data[0]);
        
        let html = '<table><thead><tr>';
        headers.forEach(h => html += `<th>${h}</th>`);
        html += '</tr></thead><tbody>';
        
        data.forEach(row => {
            html += '<tr>';
            headers.forEach(h => html += `<td>${row[h]}</td>`);
            html += '</tr>';
        });
        
        html += '</tbody></table>';
        return html;
    }
</script>
</body>
</html>
