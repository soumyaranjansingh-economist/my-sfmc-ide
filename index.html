<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My SFMC Mini-IDE</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #222; color: #fff; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* The Editor */
        textarea { 
            width: 100%; height: 300px; 
            background: #1e1e1e; color: #d4d4d4; 
            border: 1px solid #444; padding: 10px;
            font-family: monospace; font-size: 14px;
        }

        /* The Button */
        button {
            background: #007acc; color: white; border: none;
            padding: 10px 20px; cursor: pointer; font-size: 16px;
            margin-top: 10px;
        }
        button:hover { background: #005f9e; }

        /* The Output */
        #output {
            background: #333; padding: 15px; margin-top: 20px;
            border-left: 4px solid #007acc; min-height: 50px;
            white-space: pre-wrap; /* Keeps formatting */
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 My SFMC Runner</h2>
    
    <input type="text" id="sfmcUrl" placeholder="Paste your Cloud Page URL here" style="width:100%; margin-bottom:10px; padding:5px;">

    <textarea id="codeEditor">%%[ 
    SET @msg = "Hello from GitHub!" 
]%%
Output: %%=v(@msg)=%%</textarea>
    
    <button onclick="runCode()">Run Code</button>
    
    <div id="output">Result will appear here...</div>
</div>

<script>
    async function runCode() {
        const url = document.getElementById('sfmcUrl').value;
        const code = document.getElementById('codeEditor').value;
        const outputDiv = document.getElementById('output');

        if(!url) { alert("Please enter your Cloud Page URL"); return; }

        outputDiv.innerHTML = "Running...";

        try {
            // This is the fetch request (same as your VS Code 'Send Request')
            const response = await fetch(url, {
                method: 'POST',
                body: code
            });

            const result = await response.text();
            outputDiv.innerHTML = result;
            
        } catch (error) {
            outputDiv.innerHTML = "Connection Error: " + error;
        }
    }
</script>

</body>
</html>
