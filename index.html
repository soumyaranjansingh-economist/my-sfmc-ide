<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFMC Dev Console (Pro)</title>
    <style>
        /* Base Theme */
        :root {
            --bg-color: #f4f6f8;
            --card-color: #ffffff;
            --accent-color: #007bff;
            --text-color: #333;
            --border-color: #e1e4e8;
            --editor-bg: #1e1e1e; 
            --editor-text: #d4d4d4;
            --gutter-bg: #252526;
            --gutter-text: #858585;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 40px 20px;
            background-color: var(--bg-color); color: var(--text-color);
            display: flex; justify-content: center;
        }

        .container {
            width: 100%; max-width: 1000px;
            background: var(--card-color);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* Header & Toolbar */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 25px; border-bottom: 1px solid var(--border-color); background: #fafbfc;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header img { height: 28px; }
        h2 { margin: 0; font-size: 1.1rem; font-weight: 600; color: #24292e; }

        .toolbar {
            padding: 12px 25px; background: #fff;
            display: flex; gap: 15px; align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        select { padding: 8px; border: 1px solid #ced4da; border-radius: 4px; cursor: pointer; }

        .run-btn {
            background-color: var(--accent-color); color: white; border: none;
            padding: 8px 24px; border-radius: 4px; cursor: pointer;
            font-weight: 600; font-size: 14px; margin-left: auto;
            display: flex; align-items: center; gap: 8px;
        }
        .run-btn:hover { background-color: #0056b3; }
        .run-btn:disabled { background-color: #a0cfff; cursor: not-allowed; }

        /* Spinner */
        .spinner {
            display: none; width: 16px; height: 16px;
            border: 2px solid #ffffff; border-top: 2px solid transparent;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Editor with Gutter */
        .editor-wrapper {
            display: flex;
            height: 400px;
            position: relative;
            background-color: var(--editor-bg);
        }

        .line-numbers {
            width: 40px;
            background-color: var(--gutter-bg);
            color: var(--gutter-text);
            text-align: right;
            padding: 20px 5px;
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            user-select: none;
            border-right: 1px solid #333;
            overflow: hidden;
        }

        textarea {
            flex-grow: 1;
            height: 100%;
            background-color: var(--editor-bg);
            color: var(--editor-text);
            border: none; padding: 20px;
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            font-size: 13px; line-height: 1.6;
            box-sizing: border-box; resize: none; outline: none;
            white-space: pre;
            overflow: auto;
        }

        /* Output & Debug Styles */
        .output-section { background: #fafbfc; border-top: 1px solid var(--border-color); }
        .output-label {
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;
            color: #6a737d; padding: 8px 25px; background: #f6f8fa;
            border-bottom: 1px solid var(--border-color); font-weight: bold;
        }
        #output {
            padding: 25px; min-height: 100px;
            font-family: 'Menlo', monospace; font-size: 13px; color: #24292e;
            white-space: pre-wrap; overflow-x: auto;
        }

        /* Breakpoint & Log Styles */
        .debug-breakpoint {
            border: 1px solid #f5c6cb; background-color: #f8d7da; color: #721c24;
            padding: 15px; border-radius: 4px; margin-bottom: 10px;
        }
        .debug-title { font-weight: bold; display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        .debug-log {
            border-left: 3px solid #007bff; background-color: #e7f1ff; color: #004085;
            padding: 10px; margin-bottom: 5px; font-family: monospace;
        }
        .debug-data { background: rgba(255,255,255,0.5); padding: 5px; border-radius: 3px; }

        /* Error Styles */
        .error-box { background: #fff5f5; border: 1px solid #ffcdd2; padding: 15px; border-radius: 4px; color: #b71c1c; }
        .error-title { font-weight: bold; font-size: 1.1em; margin-bottom: 8px; display: block; }
        .error-detail { color: #d32f2f; font-size: 0.95em; line-height: 1.6; }
        
        details { margin-top: 10px; border: 1px solid #e2e2e2; border-radius: 4px; }
        summary { padding: 8px; cursor: pointer; background: #f0f0f0; font-weight: bold; font-size: 0.9em; }
        .stack-trace { padding: 10px; font-size: 11px; background: #fff; overflow-x: auto; }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-left">
            <img src="https://eu1static.oktacdn.com/fs/bco/4/fs0atfh9rvkiGsYSQ0i7" alt="Logo"/>
            <h2>SFMC Console Pro</h2>
        </div>
        <span class="status" id="statusMsg">Ready</span>
    </div>

    <div class="toolbar">
        <label style="font-size: 14px; color: #555;">Template:</label>
        <select id="langSelect" onchange="changeTemplate()">
            <option value="empty" disabled selected>Select...</option>
            <option value="ssjs_debug">SSJS with Breakpoints</option>
            <option value="ampscript">AMPscript</option>
            <option value="html">HTML</option>
        </select>
        
        <button class="run-btn" id="runBtn" onclick="runCode()">
            <div class="spinner" id="loadingSpinner"></div>
            <span id="btnText">Run Code</span>
        </button>
    </div>

    <div class="editor-wrapper">
        <div class="line-numbers" id="lineNumbers">1</div>
        <textarea id="codeEditor" spellcheck="false" oninput="updateLineNumbers()" onscroll="syncScroll()" placeholder="// Write your code here..."></textarea>
    </div>

    <div class="output-section">
        <div class="output-label">Console Result</div>
        <div id="output">Waiting for input...</div>
    </div>
</div>

<script>
    // ---------------------------------------------------------
    // ⚠️ CONFIGURATION: PASTE YOUR CLOUD PAGE URL HERE
    // ---------------------------------------------------------
    const CLOUD_PAGE_URL = "https://mc3cs0j7vcrk2rn8hkvfw-jmp6k4.pub.sfmc-content.com/0gnmxcncp1c"; 
    // ---------------------------------------------------------

    // 1. Templates
    const templates = {
        ssjs_debug: `<script runat="server">\n    Platform.Load("Core", "1");\n    try {\n        var name = "Developer";\n        var status = "Active";\n        \n        // 1. Log something without stopping\n        inspect("Current Status", status);\n\n        // 2. Perform logic\n        var result = 100 * 5;\n\n        // 3. STOP execution here to check result\n        breakpoint(result);\n\n        // This line will NEVER run because of the breakpoint above\n        Write("I will not print.");\n\n    } catch(e) {\n        if(e !== "BREAKPOINT") Write(Stringify(e));\n    }\n<\/script>`,
        
        ampscript: `%%[\n    VAR @msg\n    SET @msg = "Hello World"\n]%%\nMessage: %%=v(@msg)=%%`,
        
        html: `<h3>HTML Test</h3>\n<hr>\n<p>This is a test.</p>`
    };

    function changeTemplate() {
        const lang = document.getElementById('langSelect').value;
        const editor = document.getElementById('codeEditor');
        if(editor.value.length > 10 && !confirm("Overwrite current code?")) return;
        if(templates[lang]) { 
            editor.value = templates[lang];
            updateLineNumbers(); // Update gutter
        }
    }

    // 2. Main Run Function
    async function runCode() {
        let code = document.getElementById('codeEditor').value;
        const outputDiv = document.getElementById('output');
        const statusMsg = document.getElementById('statusMsg');
        const runBtn = document.getElementById('runBtn');
        const spinner = document.getElementById('loadingSpinner');
        const btnText = document.getElementById('btnText');

        if(CLOUD_PAGE_URL.includes("YOUR-CLOUD-PAGE")) {
            outputDiv.innerHTML = '<span style="color:#d32f2f">⚠ Setup Required: Paste URL in line 160.</span>';
            return;
        }

        // --- INJECT DEBUG LIBRARY ---
        // This puts the 'breakpoint()' and 'inspect()' functions secretly at the top of your code
        const debugLib = `
<script runat="server">
    function breakpoint(val) {
        Write('{"type":"break", "data":' + Stringify(val) + '}');
        throw "BREAKPOINT"; // Stops execution
    }
    function inspect(label, val) {
        Write('{"type":"log", "label":"' + label + '", "data":' + Stringify(val) + '}');
    }
<\/script>
`;
        // Only inject into SSJS scripts (check for run=server)
        if(code.includes('runat="server"')) {
            code = debugLib + code;
        }

        // UI State: Running
        statusMsg.innerText = "Executing...";
        runBtn.disabled = true; spinner.style.display = 'block'; btnText.innerText = "Running...";
        outputDiv.innerHTML = '';

        try {
            const response = await fetch(CLOUD_PAGE_URL, { method: 'POST', body: code });
            const text = await response.text();
            
            outputDiv.innerHTML = parseResult(text);
            statusMsg.innerText = "Success";
            statusMsg.style.color = "#28a745";

        } catch (networkError) {
            statusMsg.innerText = "Failed";
            statusMsg.style.color = "#dc3545";
            outputDiv.innerHTML = `<div class="error-box"><span class="error-title">Network Error</span>${networkError.message}</div>`;
        } finally {
            runBtn.disabled = false; spinner.style.display = 'none'; btnText.innerText = "Run Code";
        }
    }

    // 3. Smart Result Parser (Handles Breakpoints & Errors)
    function parseResult(text) {
        let htmlBuffer = "";
        
        // Split input by our special debug markers
        // We use Regex to separate normal HTML from our JSON debug logs
        const parts = text.split(/(|)/);

        parts.forEach(part => {
            if (part === "" || part === "") return; // Skip markers
            
            // Try to parse as Debug JSON
            if (part.trim().startsWith('{')) {
                try {
                    const obj = JSON.parse(part);
                    
                    if (obj.type === "break") {
                        // RENDER BREAKPOINT UI
                        htmlBuffer += `
                            <div class="debug-breakpoint">
                                <span class="debug-title">🛑 Breakpoint Hit (Execution Stopped)</span>
                                <div class="debug-data">${JSON.stringify(obj.data, null, 4)}</div>
                            </div>`;
                        return;
                    }
                    if (obj.type === "log") {
                        // RENDER LOG UI
                        htmlBuffer += `
                            <div class="debug-log">
                                <strong>ℹ ${obj.label}:</strong> 
                                <span class="debug-data">${JSON.stringify(obj.data)}</span>
                            </div>`;
                        return;
                    }
                    
                    // Standard Error Handling (from previous step)
                    if (obj.jintException || (obj.message && obj.description)) {
                         htmlBuffer += renderError(obj);
                         return;
                    }

                } catch(e) {} // Not JSON? Fall through.
            }
            // Just normal HTML/Text
            htmlBuffer += part;
        });

        return htmlBuffer || text;
    }

    function renderError(errorObj) {
        let pretty = `<div class="error-box"><span class="error-title">⚠ ${errorObj.message || "Error"}</span>`;
        if(errorObj.description) {
            let desc = errorObj.description.replace(errorObj.message, "").trim().replace(/\r\n/g, "<br>").replace(/\n/g, "<br>");
            if(desc) pretty += `<div class="error-detail">${desc}</div>`;
        }
        if(errorObj.jintException) {
            pretty += `<details><summary>System Stack Trace</summary><div class="stack-trace">${errorObj.jintException}</div></details>`;
        }
        return pretty + `</div>`;
    }

    // 4. Editor Gutter Logic (Line Numbers)
    function updateLineNumbers() {
        const editor = document.getElementById('codeEditor');
        const lines = editor.value.split('\n').length;
        document.getElementById('lineNumbers').innerHTML = Array(lines).fill(0).map((_, i) => i + 1).join('<br>');
    }
    function syncScroll() {
        const editor = document.getElementById('codeEditor');
        document.getElementById('lineNumbers').scrollTop = editor.scrollTop;
    }
    // Init line numbers on load
    window.onload = updateLineNumbers; 
</script>

</body>
</html>
