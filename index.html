<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFMC Dev Console</title>
    <style>
        /* Base Theme */
        :root {
            --bg-color: #f4f6f8;
            --card-color: #ffffff;
            --accent-color: #007bff;
            --text-color: #333;
            --border-color: #e1e4e8;
            --editor-bg: #1e1e1e; /* VS Code Dark */
            --editor-text: #d4d4d4;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 40px 20px;
            background-color: var(--bg-color); color: var(--text-color);
            display: flex; justify-content: center;
        }

        .container {
            width: 100%; max-width: 950px;
            background: var(--card-color);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 25px; border-bottom: 1px solid var(--border-color); background: #fafbfc;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header img { height: 28px; }
        h2 { margin: 0; font-size: 1.1rem; font-weight: 600; color: #24292e; }

        /* Toolbar */
        .toolbar {
            padding: 12px 25px; background: #fff;
            display: flex; gap: 15px; align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        select { padding: 8px; border: 1px solid #ced4da; border-radius: 4px; cursor: pointer; }

        .run-btn {
            background-color: var(--accent-color); color: white; border: none;
            padding: 8px 24px; border-radius: 4px; cursor: pointer;
            font-weight: 600; font-size: 14px; margin-left: auto;
            display: flex; align-items: center; gap: 8px;
        }
        .run-btn:hover { background-color: #0056b3; }
        .run-btn:disabled { background-color: #a0cfff; cursor: not-allowed; }

        /* Spinner (Loader) */
        .spinner {
            display: none; /* Hidden by default */
            width: 16px; height: 16px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Dark Editor */
        .editor-container { position: relative; background: var(--editor-bg); }
        textarea {
            width: 100%; height: 400px;
            background-color: var(--editor-bg);
            color: var(--editor-text);
            border: none; padding: 20px;
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            font-size: 13px; line-height: 1.6;
            box-sizing: border-box; resize: vertical; outline: none;
        }

        /* Output Section */
        .output-section { background: #fafbfc; border-top: 1px solid var(--border-color); }
        .output-label {
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;
            color: #6a737d; padding: 8px 25px; background: #f6f8fa;
            border-bottom: 1px solid var(--border-color); font-weight: bold;
        }
        #output {
            padding: 25px; min-height: 100px;
            font-family: 'Menlo', monospace; font-size: 13px; color: #24292e;
            white-space: pre-wrap; /* Preserve formatting */
            overflow-x: auto;
        }

        /* Error Styles */
        .error-box { background: #fff5f5; border: 1px solid #ffcdd2; padding: 15px; border-radius: 4px; color: #b71c1c; }
        .error-title { font-weight: bold; font-size: 1.1em; margin-bottom: 8px; display: block; }
        .error-detail { color: #d32f2f; font-size: 0.95em; line-height: 1.6; }
        .inner-exception { margin-top: 10px; padding-left: 10px; border-left: 3px solid #ef9a9a; color: #555; }
    </style>
</head>
<body>

<div class="container">
    
    <div class="header">
        <div class="header-left">
            <img src="https://eu1static.oktacdn.com/fs/bco/4/fs0atfh9rvkiGsYSQ0i7" alt="Logo"/>
            <h2>SFMC Console</h2>
        </div>
        <span class="status" id="statusMsg">Ready</span>
    </div>

    <div class="toolbar">
        <label style="font-size: 14px; color: #555;">Template:</label>
        <select id="langSelect" onchange="changeTemplate()">
            <option value="empty" disabled selected>Select...</option>
            <option value="ampscript">AMPscript</option>
            <option value="ssjs">SSJS</option>
            <option value="html">HTML</option>
        </select>
        
        <button class="run-btn" id="runBtn" onclick="runCode()">
            <div class="spinner" id="loadingSpinner"></div>
            <span id="btnText">Run Code</span>
        </button>
    </div>

    <div class="editor-container">
        <textarea id="codeEditor" spellcheck="false" placeholder="// Write your code here..."></textarea>
    </div>

    <div class="output-section">
        <div class="output-label">Console Result</div>
        <div id="output">Waiting for input...</div>
    </div>

</div>

<script>
    // ---------------------------------------------------------
    // ⚠️ CONFIGURATION: PASTE YOUR CLOUD PAGE URL HERE
    // ---------------------------------------------------------
    const CLOUD_PAGE_URL = "https://mc3cs0j7vcrk2rn8hkvfw-jmp6k4.pub.sfmc-content.com/0gnmxcncp1c"; 
    // ---------------------------------------------------------

    // 1. Templates
    const templates = {
        ampscript: `%%[\n    /* AMPscript Error Test */\n    /* Note: The missing quote below causes an error on purpose */\n    VAR @msg\n    SET @msg = "Hello World\n]%%\n\nMessage: %%=v(@msg)=%%`,
        ssjs: `<script runat="server">\n    Platform.Load("Core", "1");\n    try {\n        var data = { status: "OK" };\n        Write(Stringify(data));\n    } catch(e) {\n        Write(Stringify(e));\n    }\n<\/script>`,
        html: `<h3>HTML Test</h3>\n<hr>\n<p>This is a test.</p>`
    };

    function changeTemplate() {
        const lang = document.getElementById('langSelect').value;
        const editor = document.getElementById('codeEditor');
        if(editor.value.length > 10 && !confirm("Overwrite current code?")) return;
        if(templates[lang]) editor.value = templates[lang];
    }

    // 2. Main Run Function
    async function runCode() {
        const code = document.getElementById('codeEditor').value;
        const outputDiv = document.getElementById('output');
        const statusMsg = document.getElementById('statusMsg');
        const runBtn = document.getElementById('runBtn');
        const spinner = document.getElementById('loadingSpinner');
        const btnText = document.getElementById('btnText');

        // Validation
        if(CLOUD_PAGE_URL.includes("YOUR-CLOUD-PAGE")) {
            outputDiv.innerHTML = '<span style="color:#d32f2f">⚠ <strong>Setup Required:</strong><br>Please paste your Cloud Page URL in the HTML code (line 106).</span>';
            return;
        }

        // Start Loading State (Spinner ON)
        statusMsg.innerText = "Executing...";
        outputDiv.innerHTML = ''; // Clear previous output
        runBtn.disabled = true;
        spinner.style.display = 'block';
        btnText.innerText = "Running...";

        try {
            const response = await fetch(CLOUD_PAGE_URL, {
                method: 'POST',
                body: code
            });

            const text = await response.text();
            
            // Format the result (Check if it's that messy error or clean HTML)
            const formattedResult = parseResult(text);
            
            outputDiv.innerHTML = formattedResult;
            statusMsg.innerText = "Success";
            statusMsg.style.color = "#28a745";

        } catch (networkError) {
            statusMsg.innerText = "Failed";
            statusMsg.style.color = "#dc3545";
            outputDiv.innerHTML = `<div class="error-box"><span class="error-title">Network Error</span>${networkError.message}</div>`;
        } finally {
            // Stop Loading State (Spinner OFF)
            runBtn.disabled = false;
            spinner.style.display = 'none';
            btnText.innerText = "Run Code";
        }
    }

    // 3. The Smart Formatter Logic
    function parseResult(text) {
        // Step 1: Check if it starts with "Error: {" (The SSJS Stringify format)
        if (text.trim().startsWith('Error: {')) {
            try {
                // Remove "Error: " prefix to get clean JSON
                const jsonString = text.trim().substring(7); 
                const errorObj = JSON.parse(jsonString);

                // We successfully parsed the JSON! Now make it pretty.
                let prettyHtml = `<div class="error-box">`;
                
                // Show the main message
                if(errorObj.message) {
                    prettyHtml += `<span class="error-title">${errorObj.message}</span>`;
                }

                // Show the description, but replace \r\n with <br> for readability
                if(errorObj.description) {
                    // Replace newlines with <br>
                    let cleanDesc = errorObj.description
                        .replace(/\r\n/g, "<br>")
                        .replace(/\n/g, "<br>");
                    
                    // Highlight "inner exception" headers to make them stand out
                    cleanDesc = cleanDesc.replace(
                        /--- inner exception (\d+)---/g, 
                        '<br><strong style="color:#b71c1c; text-transform:uppercase;">--- Inner Exception $1 ---</strong>'
                    );

                    prettyHtml += `<div class="error-detail">${cleanDesc}</div>`;
                }
                
                prettyHtml += `</div>`;
                return prettyHtml;

            } catch (e) {
                // If parsing failed, just show the raw text
                return text; 
            }
        }

        // Step 2: Not an error? Just return the HTML/Text normally
        return text;
    }
</script>

</body>
</html>
